﻿﻿﻿<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifts - Christmas Shop</title>
    <link rel="icon" href="assets/snowflake.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
</head>
<body>
    <div class="page-container">
        <!-- Header -->
        <header class="header">
            <div class="header-container">
                <a href="index.html" class="logo">
                    <img src="assets/snowflake.svg" alt="The Gifts Logo">
                    <span class="action-small" style="color: #181C29;">THE GIFTS</span>
                </a>
                <div class="nav-container">
                    <nav class="nav-items" id="nav-menu">
                        <span class="nav-item active">
                            <span class="action-small nav-link-text">GIFTS</span>
                        </span>
                        <a href="index.html#about" class="nav-item">
                            <span class="action-small nav-link-text">ABOUT</span>
                        </a>
                        <a href="index.html#best-gifts" class="nav-item">
                            <span class="action-small nav-link-text">BEST</span>
                        </a>
                        <a href="#footer" class="nav-item">
                            <span class="action-small nav-link-text">CONTACTS</span>
                        </a>
                    </nav>
                </div>
                <button class="Burger" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <!-- Gifts Page Content -->
        <main class="gifts-page">
            <section id="gifts" class="gifts-section">
                <div class="gifts-section-container">
                    <div class="gifts-section-header">
                        <p class="caption" style="color: #FFFFFF;">Gifts</p>
                        <h1 class="header-1">COMPREHENSIVE GIFT COLLECTION</h1>
                    </div>

                    <div class="tabs">
                        <button class="tab active" data-category="all">ALL</button>
                        <button class="tab" data-category="work">WORK</button>
                        <button class="tab" data-category="health">HEALTH</button>
                        <button class="tab" data-category="harmony">HARMONY</button>
                    </div>

                    <div class="gifts-page-grid">
                        <!-- Karty będą generowane dynamicznie przez JS -->
                    </div>
                    <div class="show-more-container">
                        <button id="show-more-btn" class="btn-show-more action-large">SHOW MORE</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer id="footer" class="footer">
            <div class="footer-container">
                <div class="footer-cards">
                    <a href="tel:+15551234567" class="footer-card" aria-label="Call us">
                        <div class="footer-card-icon">
                            <img src="assets/images/Home/footer/santa-claus.svg" alt="Santa Claus icon">
                        </div>
                        <h3 class="header-3 footer-card-text">+375 (29) 111-22-33</h3>
                        <p class="action-large footer-card-title">CALL US</p>
                    </a>
                    <a href="mailto:northpole@christmas.shop" class="footer-card" aria-label="Write to us">
                        <div class="footer-card-icon">
                            <img src="assets/images/Home/footer/christmas-tree.svg" alt="Christmas Tree icon">
                        </div>
                        <h3 class="header-3 footer-card-text">MAGIC FOREST</h3>
                        <p class="action-large footer-card-title">MEET US</p>
                    </a>
                    <a href="https://maps.google.com/?q=North+Pole" target="_blank" rel="noopener noreferrer" class="footer-card" aria-label="Visit us">
                        <div class="footer-card-icon">
                            <img src="assets/images/Home/footer/snake.svg" alt="Snake icon">
                        </div>
                        <h3 class="header-3 footer-card-text">GIFTS@MAGIC.COM</h3>
                        <p class="action-large footer-card-title">WRITE US</p>
                    </a>
                </div>
                <div class="footer-bottom">
                    <div class="footer-socials">
                        <a href="#" class="social-icon" aria-label="Telegram">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: #181C29;">
                                <path d="M21.19 5.11L18.55 17.55C18.41 18.17 18.04 18.32 17.52 18.03L13.48 15.06L11.53 16.94C11.31 17.16 11.13 17.34 10.72 17.34L11.01 13.23L18.49 6.47C18.82 6.18 18.41 6.02 17.97 6.31L8.73 12.13L4.74 10.88C3.87 10.61 3.86 10.01 4.92 9.59L20.5 3.58C21.22 3.31 21.85 3.73 21.19 5.11Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </a>
                        <a href="#" class="social-icon" aria-label="Facebook">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: #181C29;">
                                <path d="M17 2H14C12.6739 2 11.4021 2.52678 10.4645 3.46447C9.52678 4.40215 9 5.67392 9 7V10H6V14H9V22H13V14H16L17 10H13V7C13 6.73478 13.1054 6.48043 13.2929 6.29289C13.4804 6.10536 13.7348 6 14 6H17V2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </a>
                        <a href="#" class="social-icon" aria-label="Instagram">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: #181C29;">
                                <path d="M17 2H7C4.23858 2 2 4.23858 2 7V17C2 19.7614 4.23858 22 7 22H17C19.7614 22 22 19.7614 22 17V7C22 4.23858 19.7614 2 17 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M16 11.37C16.1234 12.2022 15.9813 13.0522 15.5938 13.799C15.2063 14.5458 14.5931 15.1514 13.8416 15.5297C13.0901 15.9079 12.2384 16.0416 11.4078 15.9118C10.5771 15.782 9.8053 15.3947 9.20189 14.8054C8.59848 14.2161 8.19148 13.4542 8.03717 12.6276C7.88286 11.801 7.98801 10.9489 8.33754 10.2019C8.68706 9.45495 9.26333 8.84755 9.98552 8.46594C10.7077 8.08434 11.5391 7.94522 12.3598 8.06825C13.199 8.19472 13.9716 8.57242 14.57 9.14371C15.1685 9.715 15.5645 10.45 15.7 11.23L16 11.37Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                        </a>
                        <a href="#" class="social-icon" aria-label="X">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: #181C29;">
                                <path d="M16.8198 2H19.6418L13.4848 9.037L20.7288 18.6H15.0508L10.6028 12.786L5.51485 18.6H2.69085L9.27585 11.074L2.33285 2H8.15585L12.1768 7.311L16.8198 2ZM15.8298 16.91H17.3918L7.31485 3.591H5.63885L15.8298 16.91Z" fill="currentColor"/>
                            </svg>
                        </a>
                    </div>
                    <p class="footer-paragraph">Made in <a href="https://rs.school" target="_blank" rel="noopener noreferrer">Rolling Scopes School</a></p>
                    <p class="footer-caption">© Copyright 2025, All Rights Reserved</p>
                </div>
            </div>
        </footer>
    </div>

    <!-- Modal Window (Required for W3C and functionality) -->
    <div id="gift-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close modal">&times;</button>
            <div class="modal-body">
                <div class="modal-image">
                    <img src="assets/images/gift-for-work.png" alt="Gift Preview" id="modal-img">
                </div>
                <div class="modal-info">
                    <span class="gift-tag header-4" id="modal-tag"></span>
                    <h3 class="header-3" id="modal-title">Gift Name</h3>
                    <p class="paragraph" id="modal-description"></p>
                    <div id="modal-powers"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
